---
- name: Include OpenCode user context
  ansible.builtin.include_tasks: set_user_context.yml

- name: Verify OpenCode installation
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: |
      export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
      test -x "{{ opencode_binary }}"
      opencode --version
    executable: /bin/bash
  environment:
    HOME: "{{ opencode_home }}"
  register: opencode_check
  changed_when: false

- name: Assert OpenCode installation succeeded
  ansible.builtin.assert:
    that:
      - opencode_check.rc == 0
    fail_msg: "OpenCode installation failed"
    success_msg: "OpenCode installation completed successfully"

- name: Show OpenCode installation verification result
  ansible.builtin.debug:
    msg:
      - "OpenCode binary exists : {{ opencode_check.rc == 0 }}"
      - "Binary path            : {{ opencode_binary }}"
      - "Version                : {{ opencode_check.stdout }}"
      - "OpenCode user          : {{ opencode_user }}"