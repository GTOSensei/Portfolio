- name: Verify OpenCode installation
  become: true
  become_user: "{{ install_user }}"
  ansible.builtin.shell:
    cmd: |
      export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
      command -v opencode
      opencode --version
    executable: /bin/bash
  register: opencode_check
  changed_when: false

- name: Assert OpenCode installation succeeded
  ansible.builtin.assert:
    that:
      - opencode_check.rc == 0
    fail_msg: "OpenCode installation failed"
    success_msg: "OpenCode installation completed successfully"

- name: Show installed OpenCode version
  ansible.builtin.debug:
    var: opencode_check.stdout_lines