- name: Determine target install user
  ansible.builtin.set_fact:
    install_user: >-
      {{
        lookup('env', 'SUDO_USER')
        | default(ansible_facts['user_id'], true)
      }}

- name: Get target user account information
  ansible.builtin.getent:
    database: passwd
    key: "{{ install_user }}"

- name: Set target user home directory
  ansible.builtin.set_fact:
    install_home: "{{ ansible_facts['getent_passwd'][install_user][4] }}"
    opencode_binary: "{{ ansible_facts['getent_passwd'][install_user][4] }}/.opencode/bin/opencode"

- name: Ensure curl is installed
  become: true
  ansible.builtin.package:
    name: curl
    state: present

- name: Check if OpenCode is already installed
  ansible.builtin.stat:
    path: "{{ opencode_binary }}"
  register: opencode_installed

- name: Show installed OpenCode version
  become: true
  become_user: "{{ install_user }}"
  ansible.builtin.shell:
    cmd: |
      export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
      opencode --version
    executable: /bin/bash
  register: existing_opencode_version
  changed_when: false
  when: opencode_installed.stat.exists

- name: Print existing OpenCode version
  ansible.builtin.debug:
    msg:
      - "OpenCode is already installed"
      - "{{ existing_opencode_version.stdout }}"
  when: opencode_installed.stat.exists

- name: Download OpenCode installer
  ansible.builtin.get_url:
    url: "{{ opencode_install_url }}"
    dest: "{{ opencode_installer_path }}"
    mode: "0755"
  when: not opencode_installed.stat.exists

- name: Remove broken legacy system symlink
  become: true
  ansible.builtin.file:
    path: "{{ system_opencode_symlink }}"
    state: absent
  when: not opencode_installed.stat.exists

- name: Remove legacy root installation
  become: true
  ansible.builtin.file:
    path: "{{ root_opencode_dir }}"
    state: absent
  when: not opencode_installed.stat.exists

- name: Install OpenCode as target user
  become: true
  become_user: "{{ install_user }}"
  ansible.builtin.shell:
    cmd: "{{ opencode_installer_path }}"
    executable: /bin/bash
  environment:
    HOME: "{{ install_home }}"
    USER: "{{ install_user }}"
    CI: "true"
  when: not opencode_installed.stat.exists

- name: Remove temporary OpenCode installer
  become: true
  ansible.builtin.file:
    path: "{{ opencode_installer_path }}"
    state: absent