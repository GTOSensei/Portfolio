- name: Verify OpenCode removal
  ansible.builtin.shell:
    cmd: |
      if command -v opencode >/dev/null 2>&1; then
        echo "OpenCode still exists"
        exit 1
      else
        echo "OpenCode removed"
      fi
    executable: /bin/bash
  register: uninstall_verify
  changed_when: false

- name: Assert OpenCode removal succeeded
  ansible.builtin.assert:
    that:
      - uninstall_verify.rc == 0
    fail_msg: "OpenCode uninstall verification failed"
    success_msg: "OpenCode uninstall completed successfully"

- name: Show uninstall verification result
  ansible.builtin.debug:
    var: uninstall_verify.stdout_lines