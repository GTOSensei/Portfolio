---
- name: Include OpenCode user context
  ansible.builtin.include_tasks: set_user_context.yml

- name: Determine target uninstall user
  ansible.builtin.set_fact:
    opencode_user: >-
      {{
        opencode_target_user
        if opencode_target_user | length > 0
        else (
          lookup('env', 'SUDO_USER')
          | default(ansible_facts['user_id'], true)
        )
      }}

- name: Get target user account information
  ansible.builtin.getent:
    database: passwd
    key: "{{ opencode_user }}"

- name: Set target user paths
  ansible.builtin.set_fact:
    opencode_home: "{{ ansible_facts['getent_passwd'][opencode_user][4] }}"
    opencode_user_dir: "{{ ansible_facts['getent_passwd'][opencode_user][4] }}/.opencode"
    opencode_local_bin: "{{ ansible_facts['getent_passwd'][opencode_user][4] }}/.local/bin/opencode"
    opencode_cache_dir: "{{ ansible_facts['getent_passwd'][opencode_user][4] }}/.cache/opencode"
    opencode_config_dir: "{{ ansible_facts['getent_passwd'][opencode_user][4] }}/.config/opencode"

- name: Check if user OpenCode installation exists
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.stat:
    path: "{{ opencode_user_dir }}"
  register: user_opencode

- name: Check if system OpenCode symlink exists
  become: true
  ansible.builtin.stat:
    path: "{{ system_opencode_symlink }}"
  register: system_opencode

- name: Show installed OpenCode version before uninstall
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: |
      export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
      opencode --version
    executable: /bin/bash
  environment:
    HOME: "{{ opencode_home }}"
  register: installed_version
  changed_when: false
  failed_when: false
  when:
    - user_opencode.stat.exists or system_opencode.stat.exists

- name: Print installed OpenCode version
  ansible.builtin.debug:
    msg:
      - "Removing OpenCode installation"
      - "{{ installed_version.stdout | default('version unknown') }}"
  when:
    - user_opencode.stat.exists or system_opencode.stat.exists

- name: Remove user OpenCode installation directory
  become: true
  ansible.builtin.file:
    path: "{{ opencode_user_dir }}"
    state: absent

- name: Remove local user OpenCode binary
  become: true
  ansible.builtin.file:
    path: "{{ opencode_local_bin }}"
    state: absent

- name: Remove OpenCode cache directory
  become: true
  ansible.builtin.file:
    path: "{{ opencode_cache_dir }}"
    state: absent

- name: Remove OpenCode config directory
  become: true
  ansible.builtin.file:
    path: "{{ opencode_config_dir }}"
    state: absent

- name: Remove legacy system-wide OpenCode symlink
  become: true
  ansible.builtin.file:
    path: "{{ system_opencode_symlink }}"
    state: absent

- name: Remove legacy root OpenCode installation
  become: true
  ansible.builtin.file:
    path: "{{ root_opencode_dir }}"
    state: absent

- name: Remove temporary OpenCode installer
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ opencode_installer_path }}"
    - "{{ opencode_temp_dir }}"

