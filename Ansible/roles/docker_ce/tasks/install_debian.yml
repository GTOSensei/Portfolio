---
- name: Remove old Docker packages
  ansible.builtin.apt:
    name: "{{ docker_old_packages_debian }}"
    state: absent
    purge: true
    autoremove: true

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name: "{{ docker_prerequisites_debian }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Docker APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: "{{ docker_repo_gpg_url }}/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    validate_certs: "{{ docker_validate_certs }}"

- name: Add Docker official repository
  ansible.builtin.apt_repository:
    repo: >-
      deb
      [arch={{ docker_arch_map.get(ansible_facts['architecture'], 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }}
      stable
    state: present
    filename: docker
  notify: Update apt cache

- name: Install Docker CE packages
  ansible.builtin.apt:
    name: >-
      {{
        docker_packages
        | map(
            'regex_replace',
            '$',
            '=' + docker_version if docker_version else ''
          )
        | list
      }}
    state: "{{ docker_package_state }}"
    update_cache: true
    cache_valid_time: 3600

- name: Deploy Docker daemon configuration
  ansible.builtin.template:
    src: daemon.json.j2
    dest: "{{ docker_daemon_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker
  when: docker_manage_daemon_json | default(true)

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure Docker service is enabled
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    enabled: "{{ docker_enable_service }}"

- name: Ensure Docker service is started
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: started
  when: docker_start_service

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  loop_control:
    label: "{{ item }}"
  when:
    - docker_manage_users