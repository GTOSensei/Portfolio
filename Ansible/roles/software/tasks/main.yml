---
- name: Include OpenCode install tasks
  ansible.builtin.include_tasks: install.yml
  when: opencode_state | default('present') == 'present'

- name: Include OpenCode install verification
  ansible.builtin.include_tasks: verify.yml
  when: opencode_state | default('present') == 'present'

- name: Include OpenCode uninstall tasks
  ansible.builtin.include_tasks: uninstall.yml
  when: opencode_state == 'absent'

- name: Include OpenCode uninstall verification
  ansible.builtin.include_tasks: verify_uninstall.yml
  when: opencode_state == 'absent'